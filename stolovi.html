<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Izaberi sto</title>
    <link rel="stylesheet" href="stolovi.css" />
  </head>

  <body>
    <div class="page">
      <header class="topbar">
        <button class="btn btn--ghost" id="btnNazad" type="button">
          ← Nazad
        </button>

        <div class="topbar__title">
          <h1>Izaberi sto</h1>
          <p class="topbar__sub">
            Zeleni = plaćeno · Narandžasti = otvoren · Sivi = slobodan
          </p>
        </div>
      </header>

      <main class="content">
        <section class="card">
          <div class="tables-grid">
            <button
              id="sto1"
              class="table-card table-card--free"
              data-sto="1"
              type="button"
            >
              <span>STO 1</span>
            </button>
            <button
              id="sto2"
              class="table-card table-card--free"
              data-sto="2"
              type="button"
            >
              <span>STO 2</span>
            </button>
            <button
              id="sto3"
              class="table-card table-card--free"
              data-sto="3"
              type="button"
            >
              <span>STO 3</span>
            </button>
            <button
              id="sto4"
              class="table-card table-card--free"
              data-sto="4"
              type="button"
            >
              <span>STO 4</span>
            </button>
            <button
              id="sto5"
              class="table-card table-card--free"
              data-sto="5"
              type="button"
            >
              <span>STO 5</span>
            </button>
            <button
              id="sto6"
              class="table-card table-card--free"
              data-sto="6"
              type="button"
            >
              <span>STO 6</span>
            </button>
            <button
              id="sto7"
              class="table-card table-card--free"
              data-sto="7"
              type="button"
            >
              <span>STO 7</span>
            </button>
            <button
              id="sto8"
              class="table-card table-card--free"
              data-sto="8"
              type="button"
            >
              <span>STO 8</span>
            </button>
            <button
              id="sto9"
              class="table-card table-card--free"
              data-sto="9"
              type="button"
            >
              <span>STO 9</span>
            </button>
            <button
              id="sto10"
              class="table-card table-card--free"
              data-sto="10"
              type="button"
            >
              <span>STO 10</span>
            </button>
            <button
              id="sto11"
              class="table-card table-card--free"
              data-sto="11"
              type="button"
            >
              <span>STO 11</span>
            </button>
            <button
              id="sto12"
              class="table-card table-card--free"
              data-sto="12"
              type="button"
            >
              <span>STO 12</span>
            </button>
          </div>
        </section>
      </main>

      <footer class="footer">
        <span class="dot dot--paid"></span><span>Plaćeno</span>
        <span class="sep">•</span>
        <span class="dot dot--open"></span><span>Otvoreno</span>
        <span class="sep">•</span>
        <span class="dot dot--free"></span><span>Slobodno</span>
      </footer>
    </div>

    <script src="stolovi.js"></script>
  </body>
</html>
